{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var navLinks = document.querySelectorAll('#site-nav .visible-links a, #site-nav .hidden-links a');
  navLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      var href = this.getAttribute('href');
      // Extract hash from href (e.g. "/zhang#pub-papers" -> "pub-papers")
      var hashIndex = href.indexOf('#');
      if (hashIndex !== -1) {
        var targetId = href.substring(hashIndex + 1);
        var targetEl = document.getElementById(targetId);
        if (targetEl) {
          e.preventDefault();
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', '#' + targetId);
        }
      }
      // Handle Home link (href = "/" or "/zhang/") — scroll to top if already on homepage
      if (hashIndex === -1 && !href.startsWith('http')) {
        var path = window.location.pathname.replace(/\/$/, '');
        var linkPath = href.replace(/\/$/, '');
        if (path === linkPath || linkPath === '{{ base_path }}') {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          history.replaceState(null, '', href);
        }
      }
    });
  });
});
</script>
